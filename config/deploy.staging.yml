# Staging Configuration - Inherits from deploy.yml with overrides
service: puerto_bjj_booking_staging

image: daniel01ariasjaen/puerto_bjj_booking

registry:
  username: daniel01ariasjaen
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    hosts:
      - 5.161.77.124

proxy:
  ssl: true
  hosts:
    - staging.booking.puertojiujitsu.com
    - www.staging.booking.puertojiujitsu.com

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    RAILS_ENV: staging
    RAILS_LOG_TO_STDOUT: true
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - "puerto_bjj_booking_staging_storage:/rails/storage"
  - "puerto_bjj_booking_staging_uploads:/rails/public/uploads"